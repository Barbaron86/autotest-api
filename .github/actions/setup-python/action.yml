name: Set up Python project
description: Install pinned Poetry, select Python and restore project dependencies.

inputs:
  python-version:
    description: Python version used by the project.
    default: "3.12"
  poetry-version:
    description: Poetry version used to install locked dependencies.
    default: "2.4.3"

runs:
  using: composite
  steps:
    - name: Install Poetry
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
      run: pipx install "poetry==$POETRY_VERSION"

    - name: Set up Python and restore Poetry cache
      id: setup_python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry
        cache-dependency-path: poetry.lock

    - name: Install locked project dependencies
      shell: bash
      env:
        PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
      run: |
        poetry env use "$PYTHON_PATH"
        poetry check --lock
        poetry install --no-interaction --no-root

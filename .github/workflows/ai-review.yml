name: AI Review

on:
  workflow_dispatch:
    inputs:
      review-command:
        description: AI Review command
        required: true
        type: choice
        default: run-context
        options:
          - run-context
          - run-summary
          - run-inline
          - run
          - run-inline-reply
          - run-summary-reply
          - clear-inline
          - clear-summary
      pull-request-number:
        description: Pull request number
        required: true
        type: string
      agent-mode:
        description: Explore related project sources
        type: choice
        default: 'on'
        options: ['off', 'on']
      dry-run:
        description: Review without publishing comments (still uses the API)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.repository }}-${{ inputs.pull-request-number }}
  cancel-in-progress: false

jobs:
  review:
    name: "AI Review PR #${{ inputs.pull-request-number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Save review configuration and prompts
        run: |
          mkdir -p "$RUNNER_TEMP/ai-review"
          cp .ai-review.yaml "$RUNNER_TEMP/ai-review/review.yaml"
          cp -R .github/ai-review "$RUNNER_TEMP/ai-review/prompts"

      - name: Check out pull request sources
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/pull/${{ inputs.pull-request-number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Restore review prompts
        run: |
          mkdir -p .github/ai-review
          cp -R "$RUNNER_TEMP/ai-review/prompts/." .github/ai-review/

      - name: Review pull request
        uses: Nikita-Filonov/ai-review@199446c8a08954d1f33eeb754af4040e5f22d81f # v1.4.0
        with:
          review-command: ${{ inputs.review-command }}
        env:
          AI_REVIEW_CONFIG_FILE_YAML: ${{ runner.temp }}/ai-review/review.yaml
          AI_REVIEW_CONFIG_FILE_ENV: ${{ runner.temp }}/absent.env
          AI_REVIEW_CONFIG_FILE_JSON: ${{ runner.temp }}/absent.json
          AGENT__ENABLED: ${{ inputs.agent-mode == 'on' }}
          REVIEW__DRY_RUN: ${{ inputs.dry-run }}
          VCS__PROVIDER: GITHUB
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ inputs.pull-request-number }}
          VCS__HTTP_CLIENT__API_URL: https://api.github.com
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM__PROVIDER: OPENAI
          LLM__HTTP_CLIENT__API_URL: https://api.openai.com/v1
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENAI_API_KEY }}

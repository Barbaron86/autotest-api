name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      test-suite:
        description: API test suite
        type: choice
        default: regression
        options:
          - regression
          - regression and users
          - regression and authentication
          - regression and files
          - regression and courses
          - regression and exercises

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python project
        uses: ./.github/actions/setup-python

      - name: Validate Poetry configuration and lock file
        run: poetry check --lock

      - name: Check formatting with Ruff
        run: poetry run ruff format --check .

      - name: Lint with Ruff
        run: poetry run ruff check --output-format=github .

      - name: Type check with mypy
        run: poetry run mypy .

  api-tests:
    name: API tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      allure-available: ${{ steps.allure_results.outputs.available }}
      allure-artifact: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
      coverage-canonical: >-
        ${{ env.COVERAGE_CANONICAL == 'true' &&
            steps.api_tests.outcome == 'success' &&
            steps.coverage_report.outcome == 'success' &&
            steps.coverage_artifact.outcome == 'success' }}

    defaults:
      run:
        shell: bash

    env:
      API_PORT: "8001"
      API_BASE_URL: http://localhost:8001
      API_TIMEOUT: "10"
      COMPOSE_PROJECT_NAME: api-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_SUITE: ${{ inputs.test-suite || 'regression' }}
      COVERAGE_CANONICAL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (inputs.test-suite || 'regression') == 'regression' }}
      SWAGGER_COVERAGE_SERVICES: >-
        [{"key":"api-course","name":"API Course",
          "repository":"https://github.com/Nikita-Filonov/qa-automation-engineer-api-course",
          "swagger_url":"http://localhost:8001/openapi.json"}]
      SWAGGER_COVERAGE_HTML_REPORT_FILE: ./coverage.html

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python project
        uses: ./.github/actions/setup-python

      - name: Build and start API test environment
        id: api_start
        run: |
          mkdir -p artifacts
          docker compose up --build --wait --wait-timeout 90

      - name: Restore Swagger Coverage history
        if: ${{ env.COVERAGE_CANONICAL == 'true' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: coverage-history.json
          key: coverage-history-official-main-regression-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coverage-history-official-main-regression-v1-${{ runner.os }}-

      - name: Clear Swagger Coverage results
        run: poetry run swagger-coverage-tool clear-results

      - name: Run selected API tests
        id: api_tests
        run: poetry run pytest -m "$TEST_SUITE" --numprocesses=2

      - name: Check Swagger Coverage results
        id: coverage_results
        if: ${{ !cancelled() }}
        run: |
          if compgen -G "coverage-results/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Swagger Coverage report
        id: coverage_report
        if: ${{ !cancelled() && steps.api_start.outcome == 'success' && steps.coverage_results.outputs.available == 'true' }}
        run: |
          poetry run swagger-coverage-tool save-report
          test -s coverage.html
          test -s coverage-report.json
          test -s coverage-history.json

      - name: Cache Swagger Coverage history
        if: ${{ !cancelled() && env.COVERAGE_CANONICAL == 'true' && steps.api_tests.outcome == 'success' && steps.coverage_report.outcome == 'success' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: coverage-history.json
          key: coverage-history-official-main-regression-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Swagger Coverage report
        id: coverage_artifact
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage-report.json
            coverage-history.json
          if-no-files-found: error
          retention-days: 14

      - name: Add Swagger Coverage artifact link to workflow summary
        if: ${{ !cancelled() && steps.coverage_artifact.outcome == 'success' }}
        run: |
          {
            echo "## Swagger Coverage artifact"
            echo
            echo "Download the coverage-report artifact and open coverage.html."
            echo "[Workflow artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Allure results
        id: allure_results
        if: ${{ !cancelled() }}
        run: |
          if compgen -G "allure-results/*-result.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect API logs
        if: ${{ !cancelled() && steps.api_start.outcome != 'skipped' }}
        run: docker compose logs --no-color --timestamps > artifacts/api.log

      - name: Tear down API test environment
        if: ${{ always() && steps.api_start.outcome != 'skipped' }}
        run: docker compose down --volumes

      - name: Upload API logs
        if: ${{ !cancelled() && steps.api_start.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/api.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw Allure results
        if: ${{ !cancelled() && steps.allure_results.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results/
          if-no-files-found: error
          retention-days: 14

  reports:
    name: Publish reports
    needs:
      - api-tests
    if: >-
      ${{ always() && !cancelled() && needs.api-tests.outputs.allure-available == 'true' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
      queue: max

    defaults:
      run:
        shell: bash

    steps:
      - name: Download raw Allure results
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.api-tests.outputs.allure-artifact }}
          path: allure-results/

      - name: Download canonical Swagger Coverage report
        if: ${{ needs.api-tests.outputs.coverage-canonical == 'true' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-report
          path: swagger-coverage-report/

      - name: Select Allure report target
        id: report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            subfolder="pr-$PR_NUMBER"
            name="API tests PR #$PR_NUMBER"
          else
            subfolder="main"
            name="API tests main"
          fi
          {
            echo "subfolder=$subfolder"
            echo "name=$name"
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$subfolder/"
          } >> "$GITHUB_OUTPUT"

      - name: Check out GitHub Pages branch
        id: history
        uses: actions/checkout@v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Prepare Pages workspace
        env:
          REPORT_SUBFOLDER: ${{ steps.report.outputs.subfolder }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HISTORY_OUTCOME" == "failure" ]]; then
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/gh-pages")
            if [[ "$status" != "404" ]]; then
              echo "Cannot restore existing Pages history (HTTP $status); refusing to publish."
              exit 1
            fi
          fi
          rm -rf gh-pages/.git
          mkdir -p gh-pages
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            rm -rf "gh-pages/$REPORT_SUBFOLDER"
          else
            rm -rf "gh-pages/$REPORT_SUBFOLDER/$GITHUB_RUN_NUMBER"
          fi
          echo '<meta http-equiv="refresh" content="0; url=./main/">' > gh-pages/index.html

      - name: Add Swagger Coverage to Pages workspace
        if: ${{ needs.api-tests.outputs.coverage-canonical == 'true' }}
        run: |
          mkdir -p gh-pages/swagger-coverage
          cp swagger-coverage-report/coverage.html gh-pages/swagger-coverage/index.html
          cp swagger-coverage-report/coverage-report.json gh-pages/swagger-coverage/coverage-report.json

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.15
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: ${{ steps.report.outputs.subfolder }}
          report_name: ${{ steps.report.outputs.name }}
          keep_reports: 50

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Add report links to workflow summary
        env:
          REPORT_NAME: ${{ steps.report.outputs.name }}
          REPORT_URL: ${{ steps.report.outputs.url }}
          COVERAGE_CANONICAL: ${{ needs.api-tests.outputs.coverage-canonical }}
        run: |
          {
            echo "## Allure report"
            echo
            echo "[Open $REPORT_NAME]($REPORT_URL)"
            if [[ "$COVERAGE_CANONICAL" == "true" ]]; then
              echo
              echo "## Swagger Coverage"
              echo
              echo "[Open Swagger Coverage](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/swagger-coverage/)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

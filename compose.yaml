name: autotest-api

services:
  api:
    build:
      context: ./docker
      dockerfile: api.Dockerfile
      args:
        API_REV: ${API_REV:-ebadfac2cd8de74313e7f5469204e6e8171dd20e}
    environment:
      APP_HOST: http://localhost:${API_PORT:-8001}
      DATABASE_URL: sqlite+aiosqlite:////app/data/api.db
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: disposable-api-tests-secret-key
      JWT_ACCESS_TOKEN_EXPIRE: "1800"
      JWT_REFRESH_TOKEN_EXPIRE: "5184000"
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - api-data:/app/data
      - api-storage:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  api-data:
  api-storage:

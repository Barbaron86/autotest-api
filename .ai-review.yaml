llm:
  provider: OPENAI

  meta:
    model: gpt-6-sol
    max_tokens: 4000

  http_client:
    verify: true
    timeout: 180
    api_url: https://api.openai.com/v1

vcs:
  provider: GITHUB

  http_client:
    verify: true
    timeout: 120
    api_url: https://api.github.com

core:
  concurrency: 1

agent:
  enabled: true
  max_iterations: 6
  max_command_output_chars: 10000
  # The workflow supplies permitted Git commands for the selected PR SHA.
  allow_commands: []

repository_profile:
  source_roots: ["."]
  file_extensions: [".py", ".toml", ".md", ".yml", ".yaml"]
  exclude_paths: []

prompt:
  system_agent_prompt_files:
    - ./.github/ai-review/repository-exploration.md

  include_agent_system_prompts: true

  inline_prompt_files:
    - ./.github/ai-review/python-api-review.md

  context_prompt_files:
    - ./.github/ai-review/python-api-review.md

  summary_prompt_files:
    - ./.github/ai-review/python-api-review.md

  system_context_prompt_files:
    - ./.github/ai-review/context-review.md

  system_summary_prompt_files:
    - ./.github/ai-review/summary-review.md

  system_inline_reply_prompt_files:
    - ./.github/ai-review/python-api-review.md

  system_summary_reply_prompt_files:
    - ./.github/ai-review/python-api-review.md

  include_inline_system_prompts: true
  include_context_system_prompts: false
  include_summary_system_prompts: false
  include_inline_reply_system_prompts: true
  include_summary_reply_system_prompts: true

review:
  mode: FULL_FILE_DIFF
  dry_run: false
  ignore_pure_renames: true

  ignore_changes:
    - poetry.lock
    - ".idea/*"
    - ".venv/*"
    - "*/__pycache__/*"
    - ".pytest_cache/*"
    - ".mypy_cache/*"
    - ".ruff_cache/*"

  max_inline_comments: 3
  max_context_comments: null
  inline_comment_fallback: false

logger:
  level: DEBUG

artifacts:
  llm_enabled: false
  vcs_enabled: false

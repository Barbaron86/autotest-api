[project]
name = "autotest-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Barbaron86",email = "kirill.molodykh@mail.ru"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # Ошибки PEP8
    "W", # Предупреждения PEP8
    "F", # Критические ошибки и баги (undefined names)
    "I", # Автосортировка импортов (isort)
    "UP", # Обновление синтаксиса под Python 3.12
]
ignore = [
    "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-s -v"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"


[tool.mypy]
python_version = "3.12"


files = ["."]
strict = true

pretty = true

disable_error_code = ["import-untyped"]

exclude_gitignore = true

show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "fixtures.*"
]

disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
